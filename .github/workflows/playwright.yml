name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    
    # This spins up the docker image to test against
    services:
      the-internet:
        image: gprestes/the-internet:v2.6.5
        ports:
          - 7080:5000

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        # Tie the cache to package-lock.json
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

    # Only downloads binaries if the package-lock file hash has changed (Cache Miss)
    - name: Install Playwright Browsers (Fresh Download)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps
      
    # Even if the cache is a hit, verify dependencies
    - name: Verify Playwright System Dependencies (Cache Hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps

    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Points Playwright to the container running on port 7080
        BASE_URL: http://localhost:7080 
        
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
